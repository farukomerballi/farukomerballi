<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Faruk Ömer Ballı — Mühendis değilim, ama inşa etmeyi seviyorum.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="0.55" stop-color="#0E1630"/>
      <stop offset="1" stop-color="#121B3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#C9A86A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C9A86A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9D3A2"/>
      <stop offset="0.5" stop-color="#C9A86A"/>
      <stop offset="1" stop-color="#A9844A"/>
    </linearGradient>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#5B7BB5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#5B7BB5" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <path id="route" d="M845 90 H1015 V170 H1175 V270"/>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace; }
    .sans { font-family: 'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
    .draw { stroke-dasharray: 600; animation: draw 2.4s cubic-bezier(.6,0,.2,1) both; }
    .d1 { animation-delay: .2s } .d2 { animation-delay: .5s } .d3 { animation-delay: .8s } .d4 { animation-delay: 1.1s }
    .fade { animation: fade 1s ease-out both; }
    .f1 { animation-delay: .1s } .f2 { animation-delay: .35s } .f3 { animation-delay: .6s }
    .f4 { animation-delay: .9s } .f5 { animation-delay: 1.2s } .f6 { animation-delay: 1.5s }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes draw { from { stroke-dashoffset: 600 } to { stroke-dashoffset: 0 } }
    @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  </style>

  <!-- canvas -->
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#major)"/>
  <rect width="1280" height="360" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="17.5" fill="none" stroke="#C9A86A" stroke-opacity="0.25"/>

  <!-- registration marks -->
  <g stroke="#C9A86A" stroke-opacity="0.55" stroke-width="1.2" fill="none">
    <path d="M28 44V28H44"/><path d="M1236 28H1252V44"/>
    <path d="M28 316V332H44"/><path d="M1252 316V332H1236"/>
  </g>
  <text x="52" y="38" class="mono" font-size="10" letter-spacing="2" fill="#8C9BBF" fill-opacity="0.6">SHEET 01 / 01 · REV 2026</text>
  <text x="1228" y="328" class="mono" font-size="10" letter-spacing="2" fill="#8C9BBF" fill-opacity="0.6" text-anchor="end">SCALE 1:∞ · GITHUB.COM/FARUKOMERBALLI</text>

  <!-- left: identity -->
  <g class="fade f1">
    <rect x="72" y="96" width="6" height="6" fill="#C9A86A"/>
    <text x="90" y="103" class="mono" font-size="13" letter-spacing="3.5" fill="#C9A86A">SOLUTION ARCHITECT AT HEART</text>
  </g>
  <text x="70" y="172" class="sans fade f2" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#F3EFE6">Faruk Ömer Ballı</text>

  <!-- dimension line under the name -->
  <g class="fade f3" stroke="#8C9BBF" stroke-opacity="0.55" stroke-width="1">
    <path d="M72 194V208M594 194V208M72 201H594"/>
    <path d="M72 201l7-3.5v7zM594 201l-7-3.5v7z" fill="#8C9BBF" fill-opacity="0.55" stroke="none"/>
  </g>
  <rect x="302" y="193" width="62" height="16" fill="#0E1630" class="fade f3"/>
  <text x="333" y="205" class="mono fade f3" font-size="11" fill="#8C9BBF" text-anchor="middle">builder</text>

  <text x="72" y="252" class="sans fade f4" font-size="22" fill="#D9D4C7">
    Mühendis değilim <tspan fill="#C9A86A">:)</tspan> ama bir şeyler inşa etmeyi seviyorum.
  </text>
  <text x="72" y="288" class="mono fade f5" font-size="14" fill="#8C9BBF">
    <tspan fill="#C9A86A">$</tspan> fikir → mimari → altyapı → otomasyon → canlı<tspan class="cursor" fill="#C9A86A"> ▍</tspan>
  </text>

  <!-- right: blueprint of a build -->
  <circle cx="1040" cy="180" r="150" fill="none" stroke="#5B7BB5" stroke-opacity="0.10"/>
  <circle cx="1040" cy="180" r="110" fill="none" stroke="#5B7BB5" stroke-opacity="0.08" stroke-dasharray="3 6"/>

  <g fill="none" stroke="#C9A86A" stroke-width="1.6" stroke-linecap="round">
    <path class="draw d1" d="M900 90 H960"/>
    <path class="draw d2" d="M1015 110 V150"/>
    <path class="draw d3" d="M1070 170 H1120"/>
    <path class="draw d4" d="M1175 190 V250"/>
  </g>

  <g class="mono" font-size="12" letter-spacing="1.5" text-anchor="middle">
    <g class="fade f2">
      <rect x="790" y="70" width="110" height="40" rx="8" fill="#0E1630" stroke="#C9A86A" stroke-opacity="0.85"/>
      <text x="845" y="94" fill="#F3EFE6">idea</text>
    </g>
    <g class="fade f3">
      <rect x="960" y="70" width="110" height="40" rx="8" fill="#0E1630" stroke="#C9A86A" stroke-opacity="0.85"/>
      <text x="1015" y="94" fill="#F3EFE6">design</text>
    </g>
    <g class="fade f4">
      <rect x="960" y="150" width="110" height="40" rx="8" fill="#0E1630" stroke="#C9A86A" stroke-opacity="0.85"/>
      <text x="1015" y="174" fill="#F3EFE6">infra</text>
    </g>
    <g class="fade f5">
      <rect x="1120" y="150" width="110" height="40" rx="8" fill="#0E1630" stroke="#C9A86A" stroke-opacity="0.85"/>
      <text x="1175" y="174" fill="#F3EFE6">automate</text>
    </g>
    <g class="fade f6">
      <rect x="1120" y="250" width="110" height="40" rx="8" fill="#C9A86A" fill-opacity="0.14" stroke="#E9D3A2"/>
      <text x="1175" y="274" fill="#E9D3A2" font-weight="700">live ✦</text>
    </g>
  </g>

  <!-- annotations -->
  <g class="mono fade f6" font-size="10" fill="#8C9BBF" fill-opacity="0.7" letter-spacing="1">
    <text x="790" y="58">01 · DISCOVER</text>
    <text x="1078" y="138">02 · BUILD</text>
    <text x="1000" y="292">03 · SHIP →</text>
  </g>

  <!-- traveling signal -->
  <g>
    <circle r="7" fill="#E9D3A2" filter="url(#soft)" opacity="0.8">
      <animateMotion dur="5s" begin="1.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".6 0 .4 1">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
    <circle r="2.6" fill="#FFF6E0">
      <animateMotion dur="5s" begin="1.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".6 0 .4 1">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
  </g>
  <rect x="1112" y="242" width="126" height="56" rx="12" fill="none" stroke="#E9D3A2" stroke-opacity="0.5" class="pulse"/>
</svg>
