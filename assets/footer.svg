<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="90" viewBox="0 0 1280 90" role="img" aria-label="Built, not engineered.">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#5B7BB5" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace; }
    .line { stroke-dasharray: 520; animation: draw 2.2s cubic-bezier(.6,0,.2,1) both; }
    .r { animation-delay: .15s }
    @keyframes draw { from { stroke-dashoffset: 520 } to { stroke-dashoffset: 0 } }
  </style>
  <rect width="1280" height="90" rx="14" fill="#0E1630"/>
  <rect width="1280" height="90" rx="14" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="1279" height="89" rx="13.5" fill="none" stroke="#C9A86A" stroke-opacity="0.25"/>
  <path class="line" d="M90 45H540" stroke="#C9A86A" stroke-opacity="0.6"/>
  <path class="line r" d="M1190 45H850" stroke="#C9A86A" stroke-opacity="0.6"/>
  <rect x="636" y="41" width="8" height="8" fill="#C9A86A" transform="rotate(45 640 45)"/>
  <text x="620" y="50" class="mono" font-size="13" letter-spacing="4" fill="#F3EFE6" text-anchor="end">BUILT</text>
  <text x="662" y="50" class="mono" font-size="13" letter-spacing="4" fill="#8C9BBF">NOT ENGINEERED</text>
</svg>
